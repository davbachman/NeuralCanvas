name: Check automatic updater

on:
  push:
    paths:
      - scripts/auto-pull.sh
      - scripts/test_auto_pull.py
      - .github/workflows/auto-pull-checks.yml
  pull_request:
    paths:
      - scripts/auto-pull.sh
      - scripts/test_auto_pull.py
      - .github/workflows/auto-pull-checks.yml

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n scripts/auto-pull.sh
      - run: python -m unittest discover -s scripts -p test_auto_pull.py -v
